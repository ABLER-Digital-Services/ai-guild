name: PR Governance

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    runs-on: larger-ubuntu-8core-fixed-ip
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR template sections
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          body = os.environ.get("PR_BODY", "")
          required_sections = [
              "## Summary",
              "## Why",
              "## Change Type",
              "## Target Agent Scope",
              "## Affected Areas",
              "## Risk Check",
              "## Validation",
          ]

          missing_sections = [section for section in required_sections if section not in body]

          if missing_sections:
              print(
                  "Pull Request template is incomplete. Missing sections: "
                  + ", ".join(missing_sections),
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Validate changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          allowed_root_entries = {
              ".github",
              "docs",
              "instructions",
              "agents",
              "skills",
              "hooks",
              "workflows",
              "cookbook",
              "README.md",
              ".all-contributorsrc",
              "CONTRIBUTING.md",
              "AGENTS.md",
              "SECURITY.md",
              "CODE_OF_CONDUCT.md",
              "CODEOWNERS",
          }

          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]
          result = subprocess.run(
              ["git", "diff", "--name-only", base_sha, head_sha],
              check=True,
              capture_output=True,
              text=True,
          )
          files = [line.strip() for line in result.stdout.splitlines() if line.strip()]

          invalid_files = []
          for filename in files:
              root_entry = filename.split("/", 1)[0] if "/" in filename else filename
              if root_entry not in allowed_root_entries:
                  invalid_files.append(filename)

          if invalid_files:
              print(
                  "Pull Request contains files outside the approved repository layout: "
                  + ", ".join(invalid_files),
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Report assumed defaults
        run: |
          echo "Assumed defaults for this stage:"
          echo "- main direct push is not allowed"
          echo "- at least one human review is expected"
          echo "- AI review will be added after backend selection"
          echo "- contributor visibility starts from a simple list"