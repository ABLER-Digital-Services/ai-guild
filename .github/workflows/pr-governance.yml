name: PR ガバナンス

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    runs-on: larger-ubuntu-8core-fixed-ip
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR テンプレート必須項目を確認
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          body = os.environ.get("PR_BODY", "")
          required_sections = [
              "## Summary",
              "## Why",
              "## Change Type",
              "## Target Agent Scope",
              "## Affected Areas",
              "## Risk Check",
              "## Validation",
          ]

          missing_sections = [section for section in required_sections if section not in body]

          if missing_sections:
              print(
                  "Pull Request テンプレートが不完全です。不足しているセクション: "
                  + ", ".join(missing_sections),
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: 変更パスを確認
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          allowed_root_entries = {
              ".github",
              ".docs",
              "instructions",
              "agents",
              "skills",
              "hooks",
              "workflows",
              "cookbook",
              "README.md",
              ".all-contributorsrc",
              "CONTRIBUTING.md",
              "AGENTS.md",
              "SECURITY.md",
              "CODE_OF_CONDUCT.md",
              "CODEOWNERS",
          }

          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]
          result = subprocess.run(
              ["git", "diff", "--name-only", base_sha, head_sha],
              check=True,
              capture_output=True,
              text=True,
          )
          files = [line.strip() for line in result.stdout.splitlines() if line.strip()]

          invalid_files = []
          for filename in files:
              root_entry = filename.split("/", 1)[0] if "/" in filename else filename
              if root_entry not in allowed_root_entries:
                  invalid_files.append(filename)

          if invalid_files:
              print(
                  "Pull Request に許可されたリポジトリ構成外のファイルが含まれています: "
                  + ", ".join(invalid_files),
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: 現時点の前提を表示
        run: |
          echo "現時点の前提:"
          echo "- main への直接 push は不可"
          echo "- 人間レビューを最低 1 件想定"
          echo "- AI レビューはバックエンド選定後に追加"
          echo "- 貢献者可視化はシンプルな一覧から開始"